<body>
  <!-- Overlay mobile -->
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-brand">
      <i class="bi bi-mortarboard-fill"></i>
      <div>
        <div class="brand-title">GestSchool</div>
        <div class="brand-sub">Gestion scolaire</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <!-- Rempli par JS -->
    </nav>
    <div class="sidebar-footer">
      <button class="btn btn-sm btn-outline-light w-100" id="btnLogout">
        <i class="bi bi-box-arrow-left me-1"></i> Déconnexion
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-wrapper">
    <header class="topbar">
      <button class="btn btn-light btn-sm d-lg-none" id="btnToggleSidebar">
        <i class="bi bi-list fs-5"></i>
      </button>
      <div class="search-box">
        <i class="bi bi-search"></i>
        <input type="text" placeholder="Recherche globale…" id="globalSearch">
      </div>
      <div class="topbar-right">
        <span class="badge-annee" id="anneeBadge"></span>
        <button class="icon-btn position-relative" title="Notifications">
          <i class="bi bi-bell"></i>
          <span class="notif-dot"></span>
        </button>
        <div class="user-chip">
          <div class="avatar" id="userAvatar">A</div>
          <div class="user-info">
            <div class="user-name" id="userName">—</div>
            <div class="user-role" id="userRole">—</div>
          </div>
        </div>
      </div>
    </header>

    <main class="content" id="appContent">
      <!-- Contenu dynamique injecté ici -->
    </main>
  </div>

  <!-- Toasts -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

  <!-- ═══════════════ SERVICE WORKER ═══════════════ -->
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('./service-worker.js')
        .then(reg => console.log('[App] Service Worker enregistré', reg.scope))
        .catch(err => console.warn('[App] Service Worker non enregistré', err));
    });
  }
</script>
